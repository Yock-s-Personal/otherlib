schema-version = 1

# The editor's theme: named by "theme" under [ui] in resources/editor-config.toml.

# A colour goes under the name of its token, as "#RRGGBB", "#RRGGBBAA" or [r, g, b, a] from 0
# to 1. The tokens are listed in other-ui/src/theme/theme_tokens.hpp. A token that is not
# named here keeps the colour the engine was built with, so an empty table is the engine's
# own palette.
[colors]
# "core.accent"        = "#3BA7F0"
# "core.bg1"           = "#0B0E14"
# "inspector.field_bg" = [0.04, 0.05, 0.08, 1.0]

# Spacing and shape, in pixels.
[metrics]
density        = 1.0            # multiplies everything below; kept between 0.75 and 1.5
rounding       = 2.0            # corners of windows, fields, popups and tabs
border-size    = 1.0            # around windows and fields; 0 draws none
item-spacing   = [8.0, 4.0]
frame-padding  = [6.0, 3.0]
cell-padding   = [4.0, 2.0]
indent-spacing = 18.0
scrollbar-size = 12.0
grab-min-size  = 10.0

# A font for each use. A file is an asset path; a use that is left out is the default font.
[typography]
default = { file = "engine://resources/fonts/BlexMonoNerdFont-Regular.ttf", size = 16.0 }
mono    = { file = "engine://resources/fonts/BlexMonoNerdFont-Regular.ttf", size = 15.0 }
heading = { file = "engine://resources/fonts/BlexMonoNerdFont-Regular.ttf", size = 19.0 }
small   = { file = "engine://resources/fonts/BlexMonoNerdFont-Regular.ttf", size = 13.0 }
