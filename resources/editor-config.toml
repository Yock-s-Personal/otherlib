[driver]
boot-file = "resources/editor-assets/editor-boot.ocmd"
# vm-debug-mode = true
plugins = [
  # { name = "Other Management", path = "build/other-editor/plugins/${build-config}/other_management_plugin.dll" },
  # { name = "Tcp Side Channel", path = "build/other-editor/plugins/${build-config}/tcp_side_channel_plugin.dll" },
  # { name = "VM Debugger", path = "build/other-editor/plugins/${build-config}/vm_debugger_plugin.dll" }
]

[application]
name = "Other Editor"
metadata = [ 
  { key = "name", value = "Other Editor"}, 
  { key = "description", value = "Other Environment Project Editor"},
  { key = "author", value = "N/A"},
  { key = "version", value = "0.1.0"} 
]
core-log-level = "info"
core-log-file = "logs/editor.log"
auto-play-loaded-scenes = false

[filesystem]
# poll project files for hot-reload (off = assets treated as static)
watch-assets = true
# watch-interval-ms = 250

[rendering]
# fullscreen = true
# enable-debug = false
ui-layout-ini = "resources/ui/editor-layout.ini"
imgui-font = "resources/fonts/BlexMonoNerdFont-Regular.ttf"
pipelines = [
  "resources/editor-assets/default-pipeline.oass",
  # "resources/editor-assets/test-pipeline.toml"
]

[ui]
# enable = false
enable-environment-menu-bar = true
# colours, spacing and fonts of the UI. a driver that names none looks as ImGui does
theme = "resources/editor-assets/theme.toml"

[editor]
# the camera of the Scene View: metres a second while flying, and degrees for each pixel
#  the pointer goes while looking round
camera-move-speed = 8.0
camera-look-sensitivity = 0.25
# what a handle of the Scene View is dragged in steps of while Ctrl is held: metres,
#  degrees, and times the size
snap-move = 0.25
snap-rotate = 15.0
snap-scale = 0.1
# the ground grid of the Scene View. G over the view, or its toolbar, switches it too
grid = true

[scripting]
init-lua = "resources/editor.lua"
# runtime config for dotnet host
dotnet-runtime-config = "other-csharp-interop/resources/OtherCsBindings.runtimeconfig.json"
# a dll satisfying the Other Environment Bindings API requirements
dotnet-bindings = "build/other-csharp/${build-config}/OtherCsBindings.dll"
# a dll satisfying the Other Environment API requirements
other-csharp = "build/other-csharp/${build-config}/OtherCs.dll"
other-lua-directory = "other-lua-interop"
editor-api = "build/other-editor/api/${build-config}/OtherEditor.dll"
dotnet-modules = [
  "build/other-editor/dotnet/${build-config}/OtherEditorCs.dll"
]